<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanya’s Bookshelf</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1a3a;--bg2:#27244d;--panel:#302c5c;--ink:#f1ecff;--muted:#b3acdc;--pink:#f7b6d2;--lav:#c9b6f7;--mint:#b8f0d4;--butter:#fbe7a6;--wood:#54406b;--wood2:#3f3055;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Quicksand',ui-rounded,'Segoe UI',system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--butter);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
/* lock */
#lock{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#3a3470,var(--bg) 70%);padding:20px}
.lockcard{position:relative;width:min(340px,100%);text-align:center;background:rgba(48,44,92,.75);border:2px solid var(--lav);border-radius:28px;padding:96px 26px 26px;margin-top:70px}
.moon{position:absolute;top:-62px;left:50%;transform:translateX(-50%);width:110px;height:110px;border-radius:50%;background:var(--butter);box-shadow:0 0 40px 8px rgba(251,231,166,.45)}
.moon::after{content:"";position:absolute;width:96px;height:96px;border-radius:50%;background:#3a3470;top:-12px;left:34px;box-shadow:0 0 0 0 #000}
.lockcard h1{font-size:1.5rem;margin:0 0 4px}
.lockcard p{margin:0 0 18px;color:var(--muted)}
.field{display:block;text-align:left;margin-bottom:12px;font-weight:600;font-size:.9rem;color:var(--muted)}
.field input,.field select{display:block;width:100%;margin-top:4px;padding:10px 14px;border-radius:14px;border:2px solid transparent;background:var(--bg);outline:none}
.field input:focus,.field select:focus{border-color:var(--pink)}
.btn{border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:.88rem;line-height:1.2;cursor:pointer;background:var(--pink);color:#3a2150;box-shadow:0 2px 12px rgba(247,182,210,.22);transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(247,182,210,.4)}
.btn:active{transform:none;box-shadow:0 1px 6px rgba(247,182,210,.25)}
.btn.sm{padding:5px 12px;font-size:.8rem;box-shadow:none}
.btn.ghost{background:rgba(201,182,247,.1);color:var(--lav);box-shadow:inset 0 0 0 1.5px rgba(201,182,247,.35)}
.btn.ghost:hover{background:rgba(201,182,247,.2);color:var(--ink)}
.btn.danger{background:rgba(255,176,176,.08);color:#ffb0b0;box-shadow:inset 0 0 0 1.5px rgba(255,176,176,.45)}
.lockcard .btn{padding:10px 26px}
.btn:focus-visible,.spine:focus-visible,.miss:focus-visible,.nav:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#lock{overflow:hidden;transition:opacity .6s,transform .6s}
#lock.leaving{opacity:0;transform:scale(1.08);pointer-events:none}
.lockcard{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.moon{animation:bob 6s ease-in-out infinite,glow 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-10px)}}
@keyframes glow{0%,100%{box-shadow:0 0 36px 6px rgba(251,231,166,.35)}50%{box-shadow:0 0 56px 14px rgba(251,231,166,.6)}}
.cloud{position:absolute;height:34px;border-radius:40px;background:rgba(201,182,247,.12);animation:drift linear infinite}
.cloud.c1{width:150px;top:18%;animation-duration:70s}.cloud.c2{width:210px;top:62%;animation-duration:95s;animation-delay:-40s}.cloud.c3{width:120px;top:80%;animation-duration:60s;animation-delay:-15s}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.shoot{position:absolute;width:90px;height:2px;background:linear-gradient(90deg,transparent,#fff);left:10%;top:12%;opacity:0;animation:shoot 8s ease-in infinite}
.shoot.s2{left:45%;top:5%;animation-delay:-4s;animation-duration:11s}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(34deg)}4%{opacity:1}14%{opacity:0;transform:translate(300px,200px) rotate(34deg)}100%{opacity:0}}
.fb{position:absolute;bottom:-40px;width:14px;height:20px;border-radius:2px;opacity:.55;animation:up linear infinite}
@keyframes up{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(50deg)}}
#err{min-height:1.3em;color:#ffb0b0;font-weight:600;margin:6px 0 10px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* app */
#app{display:none;position:relative;min-height:100vh}
#app.on{display:flex}
aside{width:224px;flex:none;background:var(--bg2);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;border-right:2px solid rgba(201,182,247,.12)}
.brand{display:flex;gap:10px;align-items:center;margin:0 6px 20px}
.logo{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f9c3dc,#d9b8fb);color:#3a2150;display:flex;align-items:center;justify-content:center;font-weight:700}
.brand b{display:block}.brand small{color:var(--muted)}
aside nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:14px;padding:11px 12px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.nav:hover:not([disabled]){background:rgba(201,182,247,.12);color:var(--ink)}
.nav.act{background:linear-gradient(90deg,rgba(247,182,210,.25),rgba(201,182,247,.15));color:var(--ink);box-shadow:inset 3px 0 0 var(--pink)}
.nav[disabled]{opacity:.5;cursor:default}
.who{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:16px;padding:8px 10px;font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:var(--mint);color:#1d3a30;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.who .btn{margin-left:auto}
main{flex:1;min-width:0;padding:26px 28px 60px;position:relative}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.top h1{margin:0;font-size:1.9rem;flex:1 1 220px}
.sub{color:var(--muted);margin:0 0 18px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.tools input,.tools select{padding:9px 14px;border-radius:999px;border:2px solid var(--panel);background:var(--bg2);outline:none;min-width:0}
.tools input{flex:1 1 200px}
.tools input:focus,.tools select:focus{border-color:var(--pink)}
.case{background:linear-gradient(var(--bg2),#221f45);border:6px solid var(--wood);border-radius:14px;padding:18px 18px 0}
.row{margin-bottom:0}
.books{display:flex;align-items:flex-end;min-height:190px;padding:0 6px}
.plank{height:16px;margin:0 -18px;background:linear-gradient(var(--wood),var(--wood2));border-radius:0 0 4px 4px;box-shadow:0 6px 10px rgba(0,0,0,.3)}
.row+.row{margin-top:14px}
.spine{position:relative;flex:none;border:0;border-radius:4px 4px 2px 2px;color:#33224a;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 0;margin-right:2px;box-shadow:inset -3px 0 0 rgba(0,0,0,.12),inset 2px 0 0 rgba(255,255,255,.35);transition:transform .15s}
.spine:hover{transform:translateY(-8px)}
.spine::before,.spine::after{content:"";position:absolute;left:0;right:0;height:3px;background:rgba(51,34,74,.3)}
.spine::before{top:26px}.spine::after{bottom:30px}
.spine b{writing-mode:vertical-rl;font-size:.82rem;font-weight:700;max-height:calc(100% - 70px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:30px}
.spine small{font-size:.7rem;font-weight:700;position:absolute;bottom:6px}
.miss{flex:none;width:30px;height:170px;border:2px dashed rgba(179,172,220,.7);background:transparent;border-radius:4px;margin-right:2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;color:var(--muted);font-size:.72rem;font-weight:700;padding-bottom:6px;opacity:.75;cursor:pointer;transition:all .15s}
.miss span{font-size:1rem}
.miss:hover{opacity:1;border-color:var(--pink);color:var(--pink);transform:translateY(-6px)}
.gap{flex:none}
.empty{padding:50px 10px;text-align:center;color:var(--muted)}
/* modal */
#modal,#qmodal{position:fixed;inset:0;z-index:10;background:rgba(15,13,35,.7);display:none;align-items:center;justify-content:center;padding:16px}
#modal.on,#qmodal.on{display:flex}
.sheet{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--panel);border-radius:24px;padding:22px;border:2px solid var(--lav)}
.sheet h3{margin:0 0 14px;font-size:1.25rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button.on{border-color:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--mint);color:#1d3a30;padding:8px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#toast.on{opacity:1}
@media(max-width:720px){aside{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:auto;flex-direction:row;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5;border-right:0;border-top:2px solid rgba(201,182,247,.15)}.brand,.who span{display:none}aside nav{flex-direction:row;flex:1}.nav{justify-content:center;padding:9px}.who{background:none;padding:0}main{padding:20px 14px 100px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>

<div id="lock">
  <div class="stars" id="lstars" aria-hidden="true"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="shoot"></div><div class="shoot s2"></div>
  <div class="lockcard" id="lockcard">
    <div class="moon" aria-hidden="true"></div>
    <h1>Sanya’s Smooth Brain</h1>
    <p>hydrate don't die-drate.</p>
    <label class="field">Username<input id="u" autocomplete="off" value=""></label>
    <label class="field">Password<input id="p" type="password" autocomplete="off"></label>
    <div id="err" role="alert"></div>
    <button class="btn" id="go">Open the library</button>
  </div>
</div>

<div id="app">
  <aside>
    <div class="brand"><span class="logo">✦</span><div><b>Sanya’s Space</b><small>cozy corner</small></div></div>
    <nav>
      <button class="nav act"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h13"/></svg>Bookshelf</button>
      <button class="nav" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>More pages soon</button>
    </nav>
    <div class="who"><span class="av">S</span><span>admin</span><button class="btn ghost sm" id="out">Log out</button></div>
  </aside>
  <main>
    <div class="top"><h1>My bookshelf</h1><button class="btn" id="add">+ Add book</button></div>
    <p class="sub" id="count"></p>
    <div class="tools">
      <input id="q" type="search" placeholder="Search title, author or series" aria-label="Search books">
      <button class="btn ghost" id="exp">Export</button>
      <button class="btn ghost" id="imp">Import</button>
      <button class="btn ghost" id="demo" style="display:none">Clear samples</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
    <div class="case" id="case"></div>
  </main>
</div>

<div id="modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
  <h3 id="mt">Add a book</h3>
  <label class="field">Title<input id="f-title" list="series-list"></label>
  <label class="field">Author<input id="f-author"></label>
  <div class="two">
    <label class="field">Volume number<input id="f-vol" type="number" min="1" placeholder="optional"></label>
    <label class="field">Total volumes<input id="f-total" type="number" min="1" placeholder="optional"></label>
  </div>
  <datalist id="series-list"></datalist>
  <div class="field" style="margin-bottom:0">Spine color</div>
  <div class="sw" id="sw"></div>
  <div class="acts"><button class="btn danger" id="del" style="margin-right:auto">Delete</button><button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">Save book</button></div>
</div></div>
<div id="qmodal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="qt">
  <h3 id="qt">Add this volume?</h3>
  <p class="sub" id="q-sub" style="margin-bottom:12px"></p>
  <div class="acts"><button class="btn ghost" id="q-cancel">Not yet</button><button class="btn" id="q-ok">Yes, add it</button></div>
</div></div>
<div id="toast"></div>

<script>
var KEY='sanya-shelf-v1', COLORS=['#f7b6d2','#c9b6f7','#b6e3f7','#b8f0d4','#fbe7a6','#ffc8a8','#e0b8ff','#a8c6ff'];
var books=load(), editId=null, color=COLORS[0];
function $(i){return document.getElementById(i)}
function uid(){return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
  var s=[['The Moonlit Garden','Ivy Hart','Moonlit Trilogy',1,0],['The Silver Door','Ivy Hart','Moonlit Trilogy',2,1],['The Last Lantern','Ivy Hart','Moonlit Trilogy',3,4],
    ['Tea for Tiny Dragons','Mo Lin','Tiny Dragons',1,2],['Tiny Dragons Go West','Mo Lin','Tiny Dragons',3,3],['A Quiet Orchard','R. Vale','',null,5],['Stars Over Seattle','J. Park','',null,6],['The Paper Kite','Noor Amin','',null,7]];
  return s.map(function(x){return{id:uid(),title:x[0],author:x[1],series:x[2],vol:x[3],color:COLORS[x[4]],status:'owned',demo:true}});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(books))}catch(e){}}
function toast(t){var e=$('toast');e.textContent=t;e.className='on';setTimeout(function(){e.className=''},1800)}
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}

/* stars */
(function(){
  ['stars','lstars'].forEach(function(id){var s=$(id);for(var i=0;i<55;i++){var d=document.createElement('i');d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.animationDelay=(Math.random()*3)+'s';d.style.transform='scale('+(0.6+Math.random())+')';s.appendChild(d)}});
  var L=$('lock'),c=$('lockcard');for(var i=0;i<9;i++){var d=document.createElement('div');d.className='fb';d.style.left=(5+Math.random()*90)+'%';d.style.background=COLORS[i%COLORS.length];d.style.animationDuration=(14+Math.random()*10)+'s';d.style.animationDelay=(-Math.random()*20)+'s';L.insertBefore(d,c)}
})();

/* lock */
function unlock(){
  if($('u').value.trim()==='admin'&&$('p').value==='admin'){$('lock').classList.add('leaving');$('app').className='on';render();setTimeout(function(){$('lock').style.display='none';$('lock').classList.remove('leaving')},600)}
  else{$('err').textContent='That doesn’t match. Check the username and password and try again.';var c=$('lockcard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
}
$('go').onclick=unlock;
$('out').onclick=function(){
  closeModal();$('qmodal').className='';$('u').value='';$('p').value='';$('err').textContent='';
  $('app').className='';var L=$('lock');L.style.display='';L.classList.remove('leaving');
  var c=$('lockcard');c.style.animation='none';void c.offsetWidth;c.style.animation='';
};
['u','p'].forEach(function(i){$(i).addEventListener('keydown',function(e){if(e.key==='Enter')unlock()})});

/* shelf */
function groups(list){
  var map={},out=[];
  list.forEach(function(b){
    var k=b.series?'s:'+b.series.trim().toLowerCase():'t:'+b.id;
    if(!map[k]){map[k]={name:(b.series||b.title).toLowerCase(),series:b.series,books:[]};out.push(map[k])}
    map[k].books.push(b);
  });
  out.forEach(function(g){g.books.sort(function(a,b){return (a.vol||999)-(b.vol||999)||a.title.localeCompare(b.title)})});
  out.sort(function(a,b){return a.name.localeCompare(b.name)});
  return out;
}
function spineEl(b){
  var h=hash(b.title),w=30+h%14,ht=150+(h>>3)%44;
  var e=document.createElement('button');e.className='spine';e.style.cssText='width:'+w+'px;height:'+ht+'px;background:'+b.color;
  e.title=b.title+(b.vol?' Vol. '+b.vol:'')+' by '+(b.author||'unknown');
  e.innerHTML='<b></b>'+(b.vol?'<small>'+b.vol+'</small>':'');
  e.firstChild.textContent=b.title+(b.vol?' Vol. '+b.vol:'');
  e.onclick=function(){openModal(b.id)};
  return {el:e,w:w+2};
}
function ghostEl(g,v){
  var el=document.createElement('button');el.className='miss';el.title='Add '+g.series+' Vol. '+v;el.setAttribute('aria-label','Add '+g.series+' volume '+v);el.innerHTML='<span>+</span>'+v;
  el.onclick=function(){quickAdd(g,v)};
  return {el:el,w:32,vol:v};
}
function render(){
  var q=$('q').value.trim().toLowerCase();
  var list=books.filter(function(b){return (!q||(b.title+' '+b.author+' '+b.series).toLowerCase().indexOf(q)>-1)});
  var seriesCount={};books.forEach(function(b){if(b.series&&(b.vol||b.total))seriesCount[b.series.toLowerCase()]=1});
  $('count').textContent=books.length+(books.length===1?' book':' books')+' on the shelf'+(Object.keys(seriesCount).length?' across '+Object.keys(seriesCount).length+(Object.keys(seriesCount).length===1?' series':' series'):'');
  $('demo').style.display=books.some(function(b){return b.demo})?'':'none';
  var dl=$('series-list');dl.innerHTML='';Object.keys(books.reduce(function(a,b){if(b.series)a[b.series]=1;return a},{})).forEach(function(s){var o=document.createElement('option');o.value=s;dl.appendChild(o)});
  var cs=$('case');cs.innerHTML='';
  if(!list.length){cs.innerHTML='<div class="empty">'+(books.length?'No books match that search.':'The shelf is empty. Add your first book to start the collection.')+'</div><div class="plank"></div>';return}
  var items=[],showGhost=!q;
  groups(list).forEach(function(g,gi){
    var vols=g.books.map(function(b){return b.vol}).filter(Boolean),max=Math.max(Math.max.apply(null,vols.concat([0])),Math.max.apply(null,g.books.map(function(b){return b.total||0}))),have={};vols.forEach(function(v){have[v]=1});
    g.books.forEach(function(b){var s=spineEl(b);s.vol=b.vol||999;items.push(s)});
    if(showGhost&&g.series)for(var v=1;v<=max;v++)if(!have[v])items.push(ghostEl(g,v));
    items.push({gapEl:true,w:16,gi:gi});
  });
  /* order ghosts inside their series by volume */
  var ordered=[],cur=[];
  items.forEach(function(it){if(it.gapEl){cur.sort(function(a,b){return (a.vol||a.sortVol||0)-(b.vol||b.sortVol||0)});ordered=ordered.concat(cur,[it]);cur=[]}else cur.push(it)});
  /* spines need volume for sorting with ghosts */
  var avail=cs.clientWidth-48,rowW=0,row=null;
  function newRow(){var r=document.createElement('div');r.className='row';var b=document.createElement('div');b.className='books';r.appendChild(b);var p=document.createElement('div');p.className='plank';r.appendChild(p);cs.appendChild(r);row=b;rowW=0}
  newRow();
  ordered.forEach(function(it){
    if(it.gapEl){if(row.children.length){var g=document.createElement('div');g.className='gap';g.style.width='16px';row.appendChild(g);rowW+=16}return}
    if(rowW+it.w>avail&&row.children.length){newRow()}
    row.appendChild(it.el);rowW+=it.w;
  });
}
window.addEventListener('resize',function(){if($('app').className==='on')render()});
$('q').addEventListener('input',render);

/* modal */
function swatches(){var s=$('sw');s.innerHTML='';COLORS.forEach(function(c){var b=document.createElement('button');b.type='button';b.style.background=c;b.setAttribute('aria-label','Spine color '+c);b.className=c===color?'on':'';b.onclick=function(){color=c;swatches()};s.appendChild(b)})}
function openModal(id){
  editId=id;var b=books.filter(function(x){return x.id===id})[0];
  $('mt').textContent=b?'Edit book':'Add a book';
  $('f-title').value=b?(b.series||b.title):'';$('f-author').value=b?b.author:'';$('f-vol').value=b&&b.vol?b.vol:'';$('f-total').value=b&&b.total?b.total:'';
  color=b?b.color:COLORS[Math.floor(Math.random()*COLORS.length)];swatches();
  $('del').style.display=b?'':'none';$('modal').className='on';$('f-title').focus();
}
function closeModal(){$('modal').className=''}
$('add').onclick=function(){openModal(null)};
$('cancel').onclick=closeModal;
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();$('qmodal').className=''}});
$('qmodal').addEventListener('click',function(e){if(e.target===$('qmodal'))$('qmodal').className=''});
var qSeries=null,qVol=0;
function quickAdd(g,v){qSeries=g;qVol=v;$('q-sub').textContent=g.series+' Vol. '+v;$('qmodal').className='on';$('q-ok').focus()}
$('q-cancel').onclick=function(){$('qmodal').className=''};
$('q-ok').onclick=function(){
  var p=qSeries.books[0],t=qSeries.series;
  books.push({id:uid(),title:t,author:p.author,series:p.series,vol:qVol,total:p.total||null,color:p.color});
  save();$('qmodal').className='';render();toast('Volume '+qVol+' added');
};
$('save').onclick=function(){
  var t=$('f-title').value.trim();if(!t){$('f-title').focus();toast('Add a title first');return}
  var rec={title:t,author:$('f-author').value.trim(),series:t,vol:parseInt($('f-vol').value,10)||null,total:parseInt($('f-total').value,10)||null,color:color};
  if(editId){books=books.map(function(b){if(b.id===editId){var n=Object.assign({},b,rec);return n}return b})}
  else books.push(Object.assign({id:uid()},rec));
  if(rec.series&&rec.total){books.forEach(function(b){if((b.series||'').toLowerCase()===rec.series.toLowerCase())b.total=rec.total})}
  save();closeModal();render();toast('Book saved');
};
$('del').onclick=function(){books=books.filter(function(b){return b.id!==editId});save();closeModal();render();toast('Book removed')};
$('demo').onclick=function(){books=books.filter(function(b){return !b.demo});save();render();toast('Sample books removed')};

/* backup */
$('exp').onclick=function(){
  var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(books,null,1));a.download='bookshelf-backup.json';
  try{a.click()}catch(e){}
  toast('Backup started');
};
$('imp').onclick=function(){$('file').click()};
$('file').onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;books=d;save();render();toast('Backup loaded')}catch(x){toast('That file isn’t a bookshelf backup')}};
  r.readAsText(f);e.target.value='';
};
</script>
</body>
</html>
